<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gacha Pick</title>
<meta name="description" content="Can't decide? Turn the knob. A capsule-toy machine that picks for you — what to eat, where to go, who washes the dishes.">
<meta name="theme-color" content="#D6EFE4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root {
  --red: #E5412D; --red-dark: #B92E1F; --red-light: #F26A57;
  --glass: #BFE6F5; --tile: #D6EFE4; --grout: #F4FBF7;
  --ink: #23305E; --ink-soft: #5B6489; --paper: #FFFDF6;
  --pink: #FF8FB1; --yellow: #FFD23F; --blue: #5BB8F0; --green: #7ED492; --orange: #FF9F43;
  --ui: "Varela Round", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans HK", system-ui, sans-serif;
  --sign: "Dela Gothic One", "Varela Round", "PingFang HK", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100dvh; color: var(--ink); font-family: var(--ui); -webkit-tap-highlight-color: transparent;
  background-color: var(--tile);
  background-image:
    linear-gradient(var(--grout) 2px, transparent 2px),
    linear-gradient(90deg, var(--grout) 2px, transparent 2px);
  background-size: 34px 34px; background-position: -1px -1px;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 8px; }

.app { max-width: 980px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 40px;
  display: grid; grid-template-columns: 1fr; gap: 22px; justify-items: center; }
@media (min-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; padding-top: 48px; }
}

/* ---------------- the machine ---------------- */
.machine-wrap { width: min(360px, 88vw); }
.machine { position: relative; width: 100%; aspect-ratio: 300 / 470; user-select: none; }
.machine svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.sign { position: absolute; left: 14.7%; right: 14.7%; top: 2.6%; height: 7.2%; display: grid; place-items: center;
  font-family: var(--sign); font-weight: 700; color: #fff; font-size: clamp(14px, 4.6vw, 19px); line-height: 1; letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; text-shadow: 0 2px 0 var(--red-dark); }
.sign span { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.dome-clip { position: absolute; left: 13.3%; width: 73.4%; top: 7.66%; height: 41.7%; overflow: hidden; }
.dome { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; }
.cap { position: absolute; border-radius: 50%; transform: translate(-50%, -50%) rotate(var(--r, 0deg));
  background: linear-gradient(to bottom, var(--c) 0 50%, rgba(255,255,255,.88) 50% 100%);
  box-shadow: inset 0 0 0 2px rgba(35,48,94,.18), inset -4px -6px 0 rgba(0,0,0,.06); }
.cap::after { content: ''; position: absolute; left: 18%; top: 14%; width: 26%; height: 18%; border-radius: 50%; background: rgba(255,255,255,.7); }
.dome.shake .cap { animation: jiggle .14s ease-in-out infinite alternate; }
.dome.shake .cap:nth-child(2n) { animation-duration: .17s; }
.dome.shake .cap:nth-child(3n) { animation-duration: .12s; }
@keyframes jiggle { to { transform: translate(calc(-50% + 3px), calc(-50% - 5px)) rotate(calc(var(--r) + 14deg)); } }

#knob { transform-box: fill-box; transform-origin: center; }
.knob-hit { position: absolute; left: 33%; top: 59%; width: 34%; aspect-ratio: 1; border-radius: 50%; border: 0; background: transparent; }

.chute-cap { position: absolute; width: 15%; aspect-ratio: 1; left: 42.5%; top: 85.4%; border: 0; padding: 0; border-radius: 50%;
  background: linear-gradient(to bottom, var(--c) 0 50%, rgba(255,255,255,.95) 50% 100%);
  box-shadow: inset 0 0 0 2px rgba(35,48,94,.2), 0 3px 0 rgba(0,0,0,.18); display: none; }
.chute-cap.ready { display: block; animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.falling { position: absolute; border-radius: 50%; pointer-events: none; z-index: 3;
  background: linear-gradient(to bottom, var(--c) 0 50%, rgba(255,255,255,.95) 50% 100%); box-shadow: inset 0 0 0 2px rgba(35,48,94,.2); }

.under { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; font-size: 15px; background: var(--paper); color: var(--ink);
  box-shadow: 0 0 0 2px var(--ink), 0 4px 0 var(--ink); transition: transform .06s, box-shadow .06s; }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 2px var(--ink), 0 1px 0 var(--ink); }
.btn.primary { background: var(--red); color: #fff; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.btn.ghost { background: transparent; box-shadow: none; text-decoration: underline; text-underline-offset: 3px; padding: 8px 10px; }
.status { text-align: center; margin: 14px auto 0; min-height: 1.4em; font-size: 14.5px; color: var(--ink-soft); max-width: 34ch; }
.status b { color: var(--ink); }

/* ---------------- side: lists ---------------- */
.side { width: min(420px, 100%); }
.panel { background: var(--paper); border-radius: 22px; padding: 18px; box-shadow: 0 0 0 2px var(--ink), 0 6px 0 var(--ink); }
.panel h2 { margin: 0 0 12px; font-size: 17px; }
.lists { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; border-radius: 999px; padding: 8px 13px; font-size: 14px; background: #fff; box-shadow: inset 0 0 0 2px var(--ink);
  display: inline-flex; align-items: center; gap: 7px; max-width: 100%; }
.chip i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(35,48,94,.35); flex: none; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.on { background: var(--ink); color: #fff; }
.chip.add { background: transparent; box-shadow: inset 0 0 0 2px var(--ink); border: 0; }
.opts { margin-top: 18px; }
.opts label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.opts .hint { font-weight: 400; color: var(--ink-soft); }
.opts input[type=text], .opts textarea { width: 100%; border: 0; border-radius: 14px; padding: 11px 13px; background: #fff;
  box-shadow: inset 0 0 0 2px var(--ink); font-size: 16px; }
.opts textarea { min-height: 190px; resize: vertical; line-height: 1.55; }
.opts .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14.5px; margin-top: 14px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--red); }
.history { margin-top: 16px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; }
.history b { color: var(--ink); font-weight: 700; }
.foot { text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-top: 18px; line-height: 1.8; }
.foot a { color: var(--ink); }

/* ---------------- opening a capsule ---------------- */
.reveal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(35,48,94,.55); padding: 20px; }
.reveal.show { display: grid; }
.stage { position: relative; width: min(320px, 82vw); aspect-ratio: 1; display: grid; place-items: center; }
.half { position: absolute; left: 10%; width: 80%; height: 40%; }
.half.top { top: 10%; border-radius: 999px 999px 0 0; background: var(--c); box-shadow: inset 0 0 0 4px rgba(35,48,94,.25); }
.half.top::after { content: ''; position: absolute; left: 16%; top: 22%; width: 22%; height: 26%; border-radius: 50%; background: rgba(255,255,255,.6); }
.half.bottom { top: 50%; border-radius: 0 0 999px 999px; background: rgba(255,255,255,.92); box-shadow: inset 0 0 0 4px rgba(35,48,94,.25); }
.slip { position: relative; z-index: 2; background: var(--paper); color: var(--ink); border-radius: 6px; padding: 22px 22px 18px; min-width: 70%; max-width: 92vw;
  text-align: center; box-shadow: 0 0 0 2px var(--ink), 0 10px 30px rgba(0,0,0,.25); opacity: 0; transform: scale(.4) rotate(-6deg);
  background-image: repeating-linear-gradient(transparent 0 27px, #F0E6CF 27px 28px); }
.slip .label { font-size: 13px; color: var(--ink-soft); }
.slip .answer { font-size: clamp(28px, 9vw, 44px); font-weight: 700; line-height: 1.15; margin: 6px 0 14px; word-break: break-word; }
.slip .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.reveal.open .half.top { animation: popTop .5s cubic-bezier(.3,1.4,.6,1) forwards; }
.reveal.open .half.bottom { animation: dropBottom .5s ease-in forwards; }
.reveal.open .slip { animation: slipIn .45s .18s cubic-bezier(.2,1.5,.5,1) forwards; }
@keyframes popTop { to { transform: translate(-30%, -95%) rotate(-38deg); opacity: 0; } }
@keyframes dropBottom { to { transform: translateY(70%) rotate(8deg); opacity: 0; } }
@keyframes slipIn { to { opacity: 1; transform: none; } }

.banner { width: min(560px, 100%); grid-column: 1 / -1; background: var(--yellow); border-radius: 18px; padding: 14px 16px;
  box-shadow: 0 0 0 2px var(--ink), 0 4px 0 var(--ink); display: none; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.show { display: flex; }
.banner p { margin: 0; flex: 1 1 220px; font-size: 14.5px; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(calc(100% + 60px)); visibility: hidden;
  background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 14px; transition: transform .25s; z-index: 30; }
.toast.show { transform: translateX(-50%); visibility: visible; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) {
  .dome.shake .cap, .chute-cap.ready { animation: none !important; }
  .reveal.open .half { animation-duration: .01s !important; }
  .reveal.open .slip { animation: slipIn .01s forwards !important; }
}
</style>
</head>
<body>
<main class="app">
  <div class="banner" id="banner" role="region" aria-label="Shared list">
    <p id="bannerText"></p>
    <button class="btn small primary" id="bannerAdd">Add to my lists</button>
    <button class="btn small ghost" id="bannerNo">Not now</button>
  </div>

  <section class="machine-wrap" aria-label="Capsule machine">
    <div class="machine" id="machine">
      <svg viewBox="0 0 300 470" aria-hidden="true">
        <!-- feet -->
        <rect x="46" y="446" width="44" height="18" rx="6" fill="#23305E"/>
        <rect x="210" y="446" width="44" height="18" rx="6" fill="#23305E"/>
        <!-- sign -->
        <rect x="38" y="6" width="224" height="44" rx="12" fill="#B92E1F"/>
        <rect x="42" y="8" width="216" height="38" rx="10" fill="#E5412D"/>
        <!-- dome -->
        <circle cx="150" cy="150" r="114" fill="#23305E"/>
        <circle cx="150" cy="150" r="110" fill="#BFE6F5"/>
        <!-- body -->
        <rect x="26" y="238" width="248" height="214" rx="26" fill="#B92E1F"/>
        <rect x="26" y="232" width="248" height="212" rx="26" fill="#E5412D"/>
        <rect x="40" y="246" width="220" height="10" rx="5" fill="#F26A57" opacity=".7"/>
        <!-- coin plate -->
        <rect x="206" y="262" width="46" height="62" rx="10" fill="#FFFDF6"/>
        <rect x="226" y="272" width="6" height="26" rx="3" fill="#23305E"/>
        <text x="229" y="315" text-anchor="middle" font-family="Varela Round, sans-serif" font-size="11" fill="#23305E">free</text>
        <!-- knob -->
        <g id="knob">
          <circle cx="150" cy="327" r="47" fill="#FFFDF6" stroke="#23305E" stroke-width="4"/>
          <rect x="106" y="317" width="88" height="20" rx="10" fill="#23305E"/>
          <circle cx="150" cy="327" r="9" fill="#FFD23F" stroke="#23305E" stroke-width="3"/>
        </g>
        <!-- chute -->
        <rect x="104" y="390" width="92" height="50" rx="14" fill="#23305E"/>
        <rect x="112" y="398" width="76" height="34" rx="10" fill="#151D3D"/>
        <!-- glass shine (above the capsules) -->
        <path d="M78 92 A92 92 0 0 1 150 52" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".75" style="mix-blend-mode:screen"/>
      </svg>
      <div class="sign"><span id="signText">Gacha Pick</span></div>
      <div class="dome-clip"><div class="dome" id="dome"></div></div>
      <button class="knob-hit" id="knobBtn" aria-label="Turn the knob to get a capsule"></button>
      <button class="chute-cap" id="chuteCap" aria-label="Open your capsule"></button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="under">
      <button class="btn primary" id="turnBtn">Turn the knob</button>
      <button class="btn" id="shareBtn">Share this list</button>
    </div>
  </section>

  <aside class="side">
    <div class="panel">
      <h2>Your machines</h2>
      <div class="lists" id="lists"></div>
      <div class="opts">
        <label for="name">Name on the sign</label>
        <input type="text" id="name" maxlength="40" autocomplete="off">
        <label for="items" style="margin-top:14px">What's inside <span class="hint">— one per line</span></label>
        <textarea id="items" spellcheck="false"></textarea>
        <label class="toggle"><input type="checkbox" id="noRepeat"> Don't pick the same thing twice until every capsule is out</label>
        <div class="row">
          <button class="btn small ghost" id="refill" hidden>Refill the machine</button>
          <span></span>
          <button class="btn small ghost" id="deleteList">Delete this machine</button>
        </div>
      </div>
      <div class="history" id="history"></div>
    </div>
    <p class="foot">
      <button class="btn small ghost" id="soundBtn" aria-pressed="true">Sound on</button><br>
      Free & open source · <a href="https://github.com/tllct122/gacha-pick">GitHub</a> · <a href="https://buymeacoffee.com/sirene122">☕ Buy me a coffee</a>
    </p>
  </aside>
</main>

<div class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="answer">
  <div class="stage">
    <div class="half top"></div>
    <div class="half bottom"></div>
    <div class="slip">
      <div class="label" id="slipLabel">The machine says</div>
      <div class="answer" id="answer"></div>
      <div class="acts">
        <button class="btn small primary" id="againBtn">Turn again</button>
        <button class="btn small" id="sendBtn">Send to friends</button>
        <button class="btn small ghost" id="closeBtn">Close</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const COLORS = ['#FF8FB1', '#FFD23F', '#5BB8F0', '#7ED492', '#FF9F43', '#C9A7FF'];
  const STARTERS = [
    { name: "What's for lunch?", items: ['Ramen', 'Cha chaan teng', 'Sushi', 'Hot pot', 'Thai', 'Dim sum', 'Korean BBQ', "McDonald's", 'Curry rice', 'Noodles in the canteen'] },
    { name: 'Who washes the dishes?', items: ['Me', 'You', 'Rock paper scissors', 'Nobody — paper plates'] },
    { name: 'Weekend plan', items: ['Hike', 'Movie', 'Café hopping', 'Museum', 'Beach', 'Stay home and sleep', 'Karaoke', 'Board game café'] },
  ];
  const uid = () => Math.random().toString(36).slice(2, 9);
  const rand = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };

  /* ---------- saving (per browser) ---------- */
  const KEY = 'gacha-pick-v1';
  function load() {
    try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.lists) && d.lists.length) return d; } catch (e) {}
    const lists = STARTERS.map((s, i) => ({ id: uid(), name: s.name, items: s.items, color: COLORS[i], noRepeat: false, out: [], history: [] }));
    return { lists, current: lists[0].id, sound: true };
  }
  let data = load();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const cur = () => data.lists.find((l) => l.id === data.current) || data.lists[0];
  const itemsOf = (l) => l.items.map((s) => s.trim()).filter(Boolean);
  function pool(l) {
    const all = itemsOf(l);
    if (!l.noRepeat) return all;
    const out = new Set(l.out);
    return all.filter((x) => !out.has(x));
  }

  /* ---------- sound ---------- */
  let ac;
  function tone(freq, dur, type = 'square', vol = 0.06, when = 0) {
    if (!data.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const clicks = () => { for (let i = 0; i < 8; i++) tone(900 + (i % 2) * 140, 0.03, 'square', 0.035, i * 0.1); };
  const thunk = () => { tone(140, 0.18, 'sine', 0.2); tone(90, 0.22, 'sine', 0.15, 0.05); };
  const pop = () => { tone(520, 0.08, 'triangle', 0.12); tone(880, 0.12, 'triangle', 0.1, 0.07); tone(1320, 0.18, 'triangle', 0.08, 0.14); };
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  /* ---------- drawing the capsules in the dome ---------- */
  function renderDome() {
    const l = cur(), dome = $('#dome');
    const items = pool(l);
    const n = Math.max(items.length, 0);
    const shown = Math.min(n, 30);
    const size = shown > 18 ? 15 : shown > 10 ? 18 : 21;     // % of dome width
    // pile them up from the floor of the visible glass, row by row
    const FLOOR = 85, R = 50, caps = [];
    const chord = (yy) => Math.sqrt(Math.max(0, R * R - (yy - R) * (yy - R)));
    let y = FLOOR - size / 2, row = 0;
    while (caps.length < shown && y > size / 2 + 4) {
      const half = chord(y) - size * 0.5;
      const step = size * 0.9;
      const cols = Math.max(1, Math.floor((half * 2) / step) + 1);
      const span = (cols - 1) * step, start = R - span / 2 + (row % 2 ? step / 4 : -step / 4) * (cols > 1 ? 1 : 0);
      const order = [...Array(cols).keys()].sort(() => rand(3) - 1);   // fill the row in a messy order
      for (const c of order) {
        if (caps.length >= shown) break;
        caps.push({ x: start + c * step + (rand(5) - 2), y: y + (rand(5) - 2) });
      }
      y -= size * 0.82; row++;
    }
    dome.innerHTML = caps.map((p, i) =>
      `<div class="cap" style="left:${p.x}%;top:${p.y}%;width:${size}%;height:${size}%;--c:${COLORS[(i + rand(6)) % COLORS.length]};--r:${rand(360)}deg"></div>`).join('');
  }

  /* ---------- side panel ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function renderLists() {
    $('#lists').innerHTML = data.lists.map((l) =>
      `<button class="chip ${l.id === data.current ? 'on' : ''}" data-id="${l.id}" style="--c:${l.color}" aria-pressed="${l.id === data.current}"><i></i><span>${esc(l.name || 'Untitled')}</span></button>`).join('') +
      `<button class="chip add" id="addList">+ New machine</button>`;
  }
  function renderEditor() {
    const l = cur();
    $('#name').value = l.name;
    $('#items').value = l.items.join('\n');
    $('#noRepeat').checked = !!l.noRepeat;
    renderMeta();
  }
  function renderMeta() {
    const l = cur(), left = pool(l).length, total = itemsOf(l).length;
    $('#signText').textContent = l.name || 'Gacha Pick';
    $('#refill').hidden = !(l.noRepeat && l.out.length);
    $('#history').innerHTML = l.history.length ? `Last picks: ${l.history.slice(0, 6).map((h, i) => i ? esc(h) : `<b>${esc(h)}</b>`).join(', ')}` : '';
    if (!total) status('This machine is empty. Add a few things on the right, one per line.');
    else if (l.noRepeat && !left) status('Every capsule is out. Refill the machine to start again.');
    else if (l.noRepeat) status(`${left} of ${total} capsules left`);
    else status(`${total} capsule${total === 1 ? '' : 's'} inside`);
    $('#soundBtn').textContent = data.sound ? 'Sound on' : 'Sound off';
    $('#soundBtn').setAttribute('aria-pressed', String(!!data.sound));
  }
  function status(t) { $('#status').textContent = t; }
  function renderAll() { renderLists(); renderEditor(); renderDome(); }

  /* ---------- turning the knob ---------- */
  let busy = false, picked = null, pickedColor = COLORS[0];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  async function turn() {
    if (busy) return;
    if ($('#chuteCap').classList.contains('ready')) { openCapsule(); return; }
    const l = cur(), choices = pool(l);
    if (!choices.length) { renderMeta(); buzz(40); return; }
    busy = true;
    picked = choices[rand(choices.length)];
    pickedColor = COLORS[rand(COLORS.length)];

    // knob turns, capsules rattle
    clicks(); buzz([12, 60, 12, 60, 12]);
    $('#dome').classList.add('shake');
    await $('#knob').animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }],
      { duration: reduce ? 1 : 900, easing: 'cubic-bezier(.45,.05,.4,1)' }).finished;
    $('#dome').classList.remove('shake');

    // one capsule drops into the chute
    if (l.noRepeat) { l.out.push(picked); save(); renderDome(); }
    const m = $('#machine'), fall = document.createElement('div');
    fall.className = 'falling'; fall.style.setProperty('--c', pickedColor);
    Object.assign(fall.style, { width: '15%', aspectRatio: '1', left: '42.5%', top: '38%' });
    m.appendChild(fall);
    await fall.animate([
      { transform: 'translateY(0) rotate(0)', opacity: 1 },
      { transform: 'translateY(40%) rotate(90deg)', opacity: 0, offset: .25 },
      { transform: 'translateY(330%) rotate(200deg)', opacity: 0, offset: .7 },
      { transform: 'translateY(304%) rotate(360deg)', opacity: 1 },
    ], { duration: reduce ? 1 : 650, easing: 'ease-in' }).finished;
    fall.remove();
    thunk(); buzz(30);
    const cap = $('#chuteCap');
    cap.style.setProperty('--c', pickedColor);
    cap.classList.add('ready');
    status('Your capsule is ready — tap it to open');
    $('#turnBtn').textContent = 'Open the capsule';
    busy = false;
  }

  function openCapsule() {
    if (!picked) return;
    const l = cur();
    $('#chuteCap').classList.remove('ready');
    $('#turnBtn').textContent = 'Turn the knob';
    l.history.unshift(picked); l.history = l.history.slice(0, 20); save();
    const r = $('#reveal');
    r.style.setProperty('--c', pickedColor);
    r.querySelector('.half.top').style.background = pickedColor;
    $('#slipLabel').textContent = l.name ? `${l.name}` : 'The machine says';
    $('#answer').textContent = picked;
    r.classList.remove('open'); r.classList.add('show');
    void r.offsetWidth; r.classList.add('open');
    pop(); buzz([20, 40, 60]);
    setTimeout(() => $('#againBtn').focus(), 300);
    renderMeta();
  }
  function closeReveal() { $('#reveal').classList.remove('show', 'open'); $('#knobBtn').focus(); }

  /* ---------- sharing ---------- */
  const b64 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64 = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0)));
  function shareLink(l) { return `${location.origin}${location.pathname}#m=${b64(JSON.stringify({ n: l.name, i: itemsOf(l) }))}`; }
  async function share(text, url) {
    try { if (navigator.share) { await navigator.share({ text, url }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url ? `${text} ${url}` : text); toast('Copied — paste it in your chat'); }
    catch (e) { prompt('Copy this:', url || text); }
  }
  let toastTimer;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }

  let incoming = null;
  function readHash() {
    const m = location.hash.match(/^#m=([\w-]+)$/);
    if (!m) return;
    try {
      const d = JSON.parse(unb64(m[1]));
      if (!d || !Array.isArray(d.i)) throw 0;
      incoming = { name: String(d.n || 'Shared machine').slice(0, 40), items: d.i.map(String).map((s) => s.slice(0, 80)).slice(0, 60) };
      $('#bannerText').textContent = `A friend sent you “${incoming.name}” with ${incoming.items.length} capsules.`;
      $('#banner').classList.add('show');
    } catch (e) { toast("That link doesn't contain a machine"); }
    history.replaceState(null, '', location.pathname);
  }

  /* ---------- events ---------- */
  $('#knobBtn').onclick = turn;
  $('#turnBtn').onclick = turn;
  $('#chuteCap').onclick = openCapsule;
  $('#againBtn').onclick = () => { closeReveal(); setTimeout(turn, 120); };
  $('#closeBtn').onclick = closeReveal;
  $('#reveal').addEventListener('click', (e) => { if (e.target.id === 'reveal') closeReveal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#reveal').classList.contains('show')) closeReveal(); });
  $('#sendBtn').onclick = () => share(`${cur().name ? cur().name + ' → ' : ''}${picked} 🎯 (picked by Gacha Pick)`, shareLink(cur()));
  $('#shareBtn').onclick = () => share(`Turn my “${cur().name}” machine:`, shareLink(cur()));

  $('#lists').addEventListener('click', (e) => {
    if (e.target.closest('#addList')) {
      const l = { id: uid(), name: 'New machine', items: [], color: COLORS[data.lists.length % COLORS.length], noRepeat: false, out: [], history: [] };
      data.lists.push(l); data.current = l.id; save(); renderAll();
      $('#name').select(); return;
    }
    const b = e.target.closest('[data-id]'); if (!b || busy) return;
    data.current = b.dataset.id; save();
    $('#chuteCap').classList.remove('ready'); $('#turnBtn').textContent = 'Turn the knob';
    renderAll();
  });
  $('#name').oninput = (e) => { cur().name = e.target.value; save(); renderLists(); renderMeta(); };
  let domeTimer;
  $('#items').oninput = (e) => {
    const l = cur();
    l.items = e.target.value.split('\n');
    const still = new Set(itemsOf(l)); l.out = l.out.filter((x) => still.has(x));
    save(); renderMeta(); clearTimeout(domeTimer); domeTimer = setTimeout(renderDome, 250);
  };
  $('#items').onblur = () => { const l = cur(); l.items = itemsOf(l); save(); };
  $('#noRepeat').onchange = (e) => { const l = cur(); l.noRepeat = e.target.checked; l.out = []; save(); renderMeta(); renderDome(); };
  $('#refill').onclick = () => { cur().out = []; save(); renderMeta(); renderDome(); thunk(); };
  $('#deleteList').onclick = () => {
    const l = cur();
    if (!confirm(`Delete “${l.name || 'this machine'}”?`)) return;
    data.lists = data.lists.filter((x) => x.id !== l.id);
    if (!data.lists.length) data.lists.push({ id: uid(), name: 'New machine', items: [], color: COLORS[0], noRepeat: false, out: [], history: [] });
    data.current = data.lists[0].id; save(); renderAll();
  };
  $('#soundBtn').onclick = () => { data.sound = !data.sound; save(); renderMeta(); };
  $('#bannerAdd').onclick = () => {
    const l = { id: uid(), name: incoming.name, items: incoming.items, color: COLORS[data.lists.length % COLORS.length], noRepeat: false, out: [], history: [] };
    data.lists.push(l); data.current = l.id; save(); renderAll();
    $('#banner').classList.remove('show'); toast(`Added “${l.name}”`);
  };
  $('#bannerNo').onclick = () => $('#banner').classList.remove('show');

  renderAll();
  readHash();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
