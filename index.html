<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gacha Pick</title>
<meta name="description" content="Can't decide? Turn the knob. A retro capsule machine that picks for you — what to eat, where to go, who washes the dishes.">
<meta name="theme-color" content="#F2E4C6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root {
  /* a Showa-era kissaten: cream walls, dark wood, cream soda, cherry */
  --wall: #F2E4C6; --stripe: #E6CFA0;
  --wood: #4A2C1D; --wood-dark: #2E1A10; --gold: #D9B25B;
  --ink: #3B2318; --ink-soft: #7A5A45; --paper: #FFF8EA;
  --cherry: #C42E3A; --glass: #E3F2EC;
  --deco: "Kaisei Decol", "Hiragino Mincho ProN", "Songti TC", "PMingLiU", serif;
  --ui: "Varela Round", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans HK", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100dvh; color: var(--ink); font-family: var(--ui); -webkit-tap-highlight-color: transparent;
  background-color: var(--wall);
  background-image: repeating-linear-gradient(90deg, transparent 0 30px, var(--stripe) 30px 33px, transparent 33px 37px, var(--stripe) 37px 38px, transparent 38px 68px);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--cherry); outline-offset: 3px; border-radius: 8px; }

.lang { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 15; display: flex; padding: 3px; border-radius: 999px;
  background: var(--wood); box-shadow: 0 0 0 2px var(--gold), 0 3px 0 var(--wood-dark); }
.lang button { border: 0; background: transparent; color: var(--paper); font-size: 13.5px; padding: 6px 11px; border-radius: 999px; font-family: var(--deco); font-weight: 700; }
.lang button[aria-pressed="true"] { background: var(--gold); color: var(--wood-dark); }

.app { max-width: 980px; margin: 0 auto; padding: max(56px, calc(env(safe-area-inset-top) + 44px)) 16px 40px;
  display: grid; grid-template-columns: 1fr; gap: 26px; justify-items: center; }
@media (min-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) 330px; align-items: start; padding-top: 64px; }
}

/* ---------------- the machine (red, retro, on the counter) ---------------- */
.machine-wrap { width: min(360px, 88vw); }
.machine { position: relative; width: 100%; aspect-ratio: 300 / 486; user-select: none; }
.machine svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.sign { position: absolute; left: 14%; right: 14%; top: 0.8%; height: 7.2%; display: grid; place-items: center;
  font-family: var(--deco); font-weight: 700; color: var(--gold); font-size: clamp(15px, 4.8vw, 20px); line-height: 1; letter-spacing: .04em;
  white-space: nowrap; overflow: hidden; padding: 0 12px; text-shadow: 0 1px 0 var(--wood-dark); }
.sign span { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.dome-clip { position: absolute; left: 11.33%; width: 77.33%; top: 18.1%; height: 40.7%; overflow: hidden; }
.dome { position: absolute; left: 0; top: -7.07%; width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; }
.cap { position: absolute; border-radius: 50%; transform: translate(-50%, -50%) rotate(var(--r, 0deg));
  background: linear-gradient(to bottom, var(--c) 0 50%, rgba(255,250,240,.9) 50% 100%);
  box-shadow: inset 0 0 0 2px rgba(59,35,24,.22), inset -4px -6px 0 rgba(0,0,0,.06); }
.cap::after { content: ''; position: absolute; left: 18%; top: 14%; width: 26%; height: 18%; border-radius: 50%; background: rgba(255,255,255,.65); }
.dome.shake .cap { animation: jiggle .14s ease-in-out infinite alternate; }
.dome.shake .cap:nth-child(2n) { animation-duration: .17s; }
.dome.shake .cap:nth-child(3n) { animation-duration: .12s; }
@keyframes jiggle { to { transform: translate(calc(-50% + 3px), calc(-50% - 5px)) rotate(calc(var(--r) + 14deg)); } }

#knob { transform-box: fill-box; transform-origin: center; }
#machine3d { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: manipulation; }
.machine.is3d #machine3d { display: block;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%); }
.machine.is3d .sign { top: 0; height: 8%; border-radius: 8px; background: linear-gradient(#563424, #3f2618);
  box-shadow: inset 0 0 0 1.5px #D9B25B, 0 0 0 3px #2E1A10, 0 6px 14px rgba(46,26,16,.25); z-index: 2; }
.machine.is3d svg, .machine.is3d .dome-clip, .machine.is3d .knob-hit, .machine.is3d .chute-cap { display: none !important; }
.knob-hit { position: absolute; left: 36.7%; top: 66.7%; width: 26.7%; aspect-ratio: 1; border-radius: 50%; border: 0; background: transparent; }

.chute-cap { position: absolute; width: 12%; aspect-ratio: 1; left: 44%; top: 84.4%; border: 0; padding: 0; border-radius: 50%;
  background: linear-gradient(to bottom, var(--c) 0 50%, rgba(255,250,240,.95) 50% 100%);
  box-shadow: inset 0 0 0 2px rgba(59,35,24,.25), 0 3px 0 rgba(0,0,0,.2); display: none; }
.chute-cap.ready { display: block; animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.falling { position: absolute; border-radius: 50%; pointer-events: none; z-index: 3;
  background: linear-gradient(to bottom, var(--c) 0 50%, rgba(255,250,240,.95) 50% 100%); box-shadow: inset 0 0 0 2px rgba(59,35,24,.25); }

.under { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 12px 20px; font-family: var(--deco); font-weight: 700; font-size: 15.5px; background: var(--paper); color: var(--ink);
  box-shadow: 0 0 0 2px var(--ink), 0 4px 0 var(--ink); transition: transform .06s, box-shadow .06s; }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 2px var(--ink), 0 1px 0 var(--ink); }
.btn.primary { background: var(--cherry); color: var(--paper); }
.btn.small { padding: 8px 14px; font-size: 14px; }
.btn.ghost { background: transparent; box-shadow: none; text-decoration: underline; text-underline-offset: 3px; padding: 8px 10px; font-family: var(--ui); font-weight: 400; }
.status { text-align: center; margin: 12px auto 0; min-height: 1.4em; font-size: 14.5px; color: var(--ink-soft); max-width: 34ch; }

/* ---------------- side: a café menu card ---------------- */
.side { width: min(420px, 100%); }
.panel { background: var(--paper); border-radius: 6px; padding: 22px 20px 18px; position: relative;
  box-shadow: 0 0 0 2px var(--wood), 0 0 0 6px var(--paper), 0 0 0 8px var(--wood), 0 12px 24px rgba(74,44,29,.18); }
.panel h2 { margin: 0 0 14px; font-family: var(--deco); font-weight: 700; font-size: 21px; text-align: center; }
.panel h2::after { content: ''; display: block; width: 60px; height: 2px; margin: 8px auto 0; background: var(--gold); }
.lists { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; border-radius: 999px; padding: 8px 13px; font-size: 14px; background: #fff; box-shadow: inset 0 0 0 2px var(--ink);
  display: inline-flex; align-items: center; gap: 7px; max-width: 100%; }
.chip i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(59,35,24,.35); flex: none; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.on { background: var(--wood); color: var(--paper); }
.chip.add { background: transparent; }
.opts { margin-top: 18px; }
.opts label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.opts .hint { font-weight: 400; color: var(--ink-soft); }
.opts input[type=text], .opts textarea { width: 100%; border: 0; border-radius: 10px; padding: 11px 13px; background: #fff;
  box-shadow: inset 0 0 0 2px var(--ink); font-size: 16px; }
.opts textarea { min-height: 190px; resize: vertical; line-height: 1.55; }
.opts .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.opts .toggle { display: flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 400; margin-top: 14px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--cherry); flex: none; }
.history { margin-top: 14px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; }
.history b { color: var(--ink); }
.foot { text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-top: 22px; line-height: 1.8; }
.foot a { color: var(--ink); }

/* the menu: ready-made machines, listed like a café menu with prices */
.side { display: grid; gap: 30px; }
.menu-hint { margin: -4px 0 10px; text-align: center; font-size: 13.5px; color: var(--ink-soft); }
.menu-cat { font-family: var(--deco); font-weight: 700; font-size: 16px; margin: 16px 0 4px; color: var(--cherry); }
.menu-item { display: flex; align-items: baseline; gap: 8px; width: 100%; border: 0; background: transparent; padding: 7px 4px; border-radius: 8px; text-align: left; font-size: 15px; }
.menu-item:hover { background: rgba(217,178,91,.16); }
.menu-item .dots { flex: 1; border-bottom: 2px dotted rgba(59,35,24,.35); transform: translateY(-4px); min-width: 16px; }
.menu-item .price { font-family: var(--deco); font-weight: 700; font-size: 14px; white-space: nowrap; }
.menu-item.have .price { color: var(--melon, #367F50); }

/* ---------------- opening a capsule: the order slip ---------------- */
.reveal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(46,26,16,.6); padding: 20px; }
.reveal.show { display: grid; }
.stage { position: relative; width: min(320px, 84vw); aspect-ratio: 1; display: grid; place-items: center; }
.half { position: absolute; left: 10%; width: 80%; height: 40%; }
.half.top { top: 10%; border-radius: 999px 999px 0 0; background: var(--c); box-shadow: inset 0 0 0 4px rgba(59,35,24,.25); }
.half.top::after { content: ''; position: absolute; left: 16%; top: 22%; width: 22%; height: 26%; border-radius: 50%; background: rgba(255,255,255,.55); }
.half.bottom { top: 50%; border-radius: 0 0 999px 999px; background: rgba(255,250,240,.92); box-shadow: inset 0 0 0 4px rgba(59,35,24,.25); }
.slip { position: relative; z-index: 2; background: var(--paper); color: var(--ink); padding: 18px 20px 16px; width: min(300px, 86vw);
  text-align: center; border: 4px double var(--ink); box-shadow: 0 14px 30px rgba(0,0,0,.3); opacity: 0; transform: scale(.4) rotate(-6deg); }
.slip .no { position: absolute; top: 8px; right: 10px; font-size: 11.5px; color: var(--cherry); font-family: var(--deco); }
.slip .label { font-family: var(--deco); font-size: 14px; color: var(--ink-soft); padding-bottom: 8px; border-bottom: 1px dashed var(--ink-soft); }
.slip .answer { font-family: var(--deco); font-weight: 700; font-size: clamp(30px, 9.5vw, 44px); line-height: 1.15; margin: 16px 0 16px; word-break: break-word; }
.slip .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding-top: 12px; border-top: 1px dashed var(--ink-soft); }
.slip .stamp { position: absolute; left: 12px; bottom: 54px; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--cherry); color: var(--cherry);
  display: grid; place-items: center; font-family: var(--deco); font-weight: 700; font-size: 13px; transform: rotate(-14deg); opacity: .8; }
.reveal.open .half.top { animation: popTop .5s cubic-bezier(.3,1.4,.6,1) forwards; }
.reveal.open .half.bottom { animation: dropBottom .5s ease-in forwards; }
.reveal.open .slip { animation: slipIn .45s .18s cubic-bezier(.2,1.5,.5,1) forwards; }
@keyframes popTop { to { transform: translate(-30%, -95%) rotate(-38deg); opacity: 0; } }
@keyframes dropBottom { to { transform: translateY(70%) rotate(8deg); opacity: 0; } }
@keyframes slipIn { to { opacity: 1; transform: rotate(-1.5deg); } }

.banner { width: min(560px, 100%); grid-column: 1 / -1; background: var(--paper); border-radius: 8px; padding: 14px 16px;
  box-shadow: 0 0 0 2px var(--ink), 0 4px 0 var(--ink); display: none; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.show { display: flex; }
.banner p { margin: 0; flex: 1 1 220px; font-size: 14.5px; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(calc(100% + 60px)); visibility: hidden;
  background: var(--wood); color: var(--paper); padding: 11px 18px; border-radius: 999px; font-size: 14px; transition: transform .25s; z-index: 30; }
.toast.show { transform: translateX(-50%); visibility: visible; }

@media (prefers-reduced-motion: reduce) {
  .dome.shake .cap, .chute-cap.ready { animation: none !important; }
  .reveal.open .half { animation-duration: .01s !important; }
  .reveal.open .slip { animation: slipIn .01s forwards !important; }
}
</style>
</head>
<body>
<div class="lang" role="group" aria-label="Language">
  <button data-lang="en" aria-pressed="true">EN</button>
  <button data-lang="zh" aria-pressed="false">中</button>
  <button data-lang="yue" aria-pressed="false">粵</button>
</div>

<main class="app">
  <div class="banner" id="banner" role="region">
    <p id="bannerText"></p>
    <button class="btn small primary" id="bannerAdd" data-t="bannerAdd"></button>
    <button class="btn small ghost" id="bannerNo" data-t="bannerNo"></button>
  </div>

  <section class="machine-wrap">
    <div class="machine" id="machine">
      <svg viewBox="0 0 300 486" aria-hidden="true">
        <!-- counter -->
        <rect x="-30" y="462" width="360" height="24" rx="4" fill="#4A2C1D"/>
        <rect x="-30" y="462" width="360" height="5" fill="#6B4430"/>
        <!-- wooden sign with gold rim -->
        <rect x="34" y="2" width="232" height="40" rx="8" fill="#2E1A10"/>
        <rect x="37" y="4" width="226" height="35" rx="6" fill="#4A2C1D" stroke="#D9B25B" stroke-width="1.6"/>
        <circle cx="46" cy="21.5" r="2.4" fill="#D9B25B"/><circle cx="254" cy="21.5" r="2.4" fill="#D9B25B"/>
        <!-- glass globe -->
        <circle cx="150" cy="190" r="120" fill="#3B2318"/>
        <circle cx="150" cy="190" r="116" fill="#E3F2EC"/>
        <!-- base: short, tapered, wider at the bottom -->
        <path d="M84 306 H216 L246 444 Q248 456 236 456 H64 Q52 456 54 444 Z" fill="#8E1F2A"/>
        <path d="M84 300 H216 L244 438 Q246 450 234 450 H66 Q54 450 56 438 Z" fill="#C42E3A"/>
        <path d="M92 312 L72 430" stroke="#E25B66" stroke-width="6" stroke-linecap="round" opacity=".5"/>
        <rect x="56" y="440" width="188" height="2.4" rx="1.2" fill="#D9B25B"/>
        <!-- collar ring under the globe -->
        <rect x="76" y="290" width="148" height="20" rx="8" fill="#8E1F2A"/>
        <rect x="76" y="286" width="148" height="20" rx="8" fill="#C42E3A"/>
        <rect x="84" y="292" width="132" height="2.4" rx="1.2" fill="#D9B25B"/>
        <!-- coin plate -->
        <rect x="196" y="338" width="30" height="40" rx="6" fill="#FFF8EA" stroke="#3B2318" stroke-width="2"/>
        <rect x="209" y="344" width="4" height="16" rx="2" fill="#3B2318"/>
        <text id="coinText" x="211" y="372" text-anchor="middle" font-family="Kaisei Decol, serif" font-weight="700" font-size="8.5" fill="#3B2318">free</text>
        <!-- turn handle -->
        <g id="knob">
          <circle cx="150" cy="364" r="34" fill="#FFF8EA" stroke="#3B2318" stroke-width="3.5"/>
          <circle cx="150" cy="364" r="27" fill="none" stroke="#D9B25B" stroke-width="1.4"/>
          <rect x="118" y="356" width="64" height="16" rx="8" fill="#3B2318"/>
          <circle cx="150" cy="364" r="7" fill="#D9B25B" stroke="#3B2318" stroke-width="2"/>
        </g>
        <!-- chute with a little flap -->
        <rect x="116" y="406" width="68" height="36" rx="10" fill="#3B2318"/>
        <rect x="122" y="412" width="56" height="24" rx="7" fill="#2E1A10"/>
        <path d="M122 418 Q150 410 178 418" stroke="#6B4430" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- red lid on top of the globe -->
        <path d="M100 86 Q100 60 150 58 Q200 60 200 86 Z" fill="#8E1F2A"/>
        <path d="M102 82 Q102 58 150 56 Q198 58 198 82 Z" fill="#C42E3A"/>
        <rect x="96" y="80" width="108" height="10" rx="5" fill="#C42E3A" stroke="#8E1F2A" stroke-width="1.5"/>
        <rect x="140" y="46" width="20" height="12" rx="5" fill="#C42E3A" stroke="#8E1F2A" stroke-width="1.5"/>
        <path d="M118 70 Q130 62 146 61" stroke="#E25B66" stroke-width="4" stroke-linecap="round" fill="none" opacity=".7"/>
        <!-- glass shine -->
        <path d="M66 172 A88 88 0 0 1 104 112" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".8"/>
      </svg>
      <div class="sign"><span id="signText">Gacha Pick</span></div>
      <canvas id="machine3d" aria-hidden="true"></canvas>
      <div class="dome-clip"><div class="dome" id="dome"></div></div>
      <button class="knob-hit" id="knobBtn"></button>
      <button class="chute-cap" id="chuteCap"></button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="under">
      <button class="btn primary" id="turnBtn"></button>
      <button class="btn" id="shareBtn" data-t="share"></button>
    </div>
  </section>

  <aside class="side">
    <div class="panel">
      <h2 data-t="machines"></h2>
      <div class="lists" id="lists"></div>
      <div class="opts">
        <label for="name" data-t="nameLabel"></label>
        <input type="text" id="name" maxlength="40" autocomplete="off">
        <label for="items" style="margin-top:14px"><span data-t="inside"></span> <span class="hint" data-t="insideHint"></span></label>
        <textarea id="items" spellcheck="false"></textarea>
        <label class="toggle"><input type="checkbox" id="noRepeat"> <span data-t="noRepeat"></span></label>
        <div class="row">
          <button class="btn small ghost" id="refill" data-t="refill" hidden></button>
          <span></span>
          <button class="btn small ghost" id="deleteList" data-t="delete"></button>
        </div>
      </div>
      <div class="history" id="history"></div>
    </div>
    <div class="panel menu">
      <h2 data-t="menu"></h2>
      <p class="menu-hint" data-t="menuHint"></p>
      <div id="menu"></div>
    </div>
    <p class="foot">
      <button class="btn small ghost" id="soundBtn"></button><br>
      <span data-t="free"></span> · <a href="https://github.com/tllct122/gacha-pick">GitHub</a> · <a href="https://buymeacoffee.com/sirene122">☕ Buy me a coffee</a>
    </p>
  </aside>
</main>

<div class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="answer">
  <div class="stage">
    <div class="half top"></div>
    <div class="half bottom"></div>
    <div class="slip">
      <span class="no" id="slipNo"></span>
      <div class="label" id="slipLabel"></div>
      <div class="answer" id="answer"></div>
      <div class="acts">
        <button class="btn small primary" id="againBtn" data-t="again"></button>
        <button class="btn small" id="sendBtn" data-t="send"></button>
        <button class="btn small ghost" id="closeBtn" data-t="close"></button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

  const uid = () => Math.random().toString(36).slice(2, 9);
  const rand = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };

  const KEY = 'gacha-pick-v1';
  const guessLang = () => { const l = navigator.language || ''; return /^(zh-(HK|MO)|yue)/i.test(l) ? 'yue' : /^zh/i.test(l) ? 'zh' : 'en'; };
  const blank = (name, items, color) => ({ id: uid(), name, items, color, noRepeat: false, out: [], history: [] });
  /** A machine from the menu; it follows the language until you edit it. */
  function fromMenu(id, lang, color) {
    const e = LIBRARY.find((x) => x.id === id);
    return { ...blank(e.name[lang], e.items[lang].slice(), color), libId: id, edited: false };
  }
  function relocalise() {
    for (const l of data.lists) {
      const e = l.libId && !l.edited && LIBRARY.find((x) => x.id === l.libId);
      if (e) { l.name = e.name[data.lang]; l.items = e.items[data.lang].slice(); l.out = []; }
    }
  }
  function starters(lang) { return STARTERS.map((id, i) => fromMenu(id, lang, COLORS[i])); }

    try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.lists) && d.lists.length) return { lang: guessLang(), sound: true, ...d }; } catch (e) {}
    const lang = guessLang(), lists = starters(lang);

  }

  const t = () => T[data.lang] || T.en;

  const cur = () => data.lists.find((l) => l.id === data.current) || data.lists[0];
  const itemsOf = (l) => l.items.map((s) => s.trim()).filter(Boolean);
  function pool(l) {
    const all = itemsOf(l);

  let ac;
  function tone(freq, dur, type = 'square', vol = 0.06, when = 0) {
    if (!data.sound) return;

      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const at = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, at);
      g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);

  /* ---------- the capsules in the dome ---------- */
  let M = null, domeKey = '';
  const someColor = () => COLORS[rand(COLORS.length)];
  function renderDome() {
    const items = pool(cur()), dome = $('#dome');
    if (M) {
      // a different machine → pour new capsules in; same machine → just add or take out the difference
      if (domeKey !== cur().id) { domeKey = cur().id; M.clearTray(); M.setCapsules(items.slice(0, 26).map(someColor)); }
      else M.setCount(items.length, someColor);
      return;
    }
    const shown = Math.min(items.length, 30);
    const size = shown > 18 ? 15 : shown > 10 ? 18 : 21;     // % of dome width
    // pile them up from the floor of the visible glass, row by row
    const FLOOR = 90, R = 50, caps = [];
    const chord = (yy) => Math.sqrt(Math.max(0, R * R - (yy - R) * (yy - R)));
    let y = FLOOR - size / 2, row = 0;
    while (caps.length < shown && y > size / 2 + 4) {
      const half = chord(y) - size * 0.5, step = size * 0.9;
      const cols = Math.max(1, Math.floor((half * 2) / step) + 1);
      const span = (cols - 1) * step, start = R - span / 2 + (row % 2 ? step / 4 : -step / 4) * (cols > 1 ? 1 : 0);
      const order = [...Array(cols).keys()].sort(() => rand(3) - 1);
      for (const c of order) {
        if (caps.length >= shown) break;
        caps.push({ x: start + c * step + (rand(5) - 2), y: y + (rand(5) - 2) });
      }
      y -= size * 0.82; row++;

  /* ---------- turning the knob ---------- */
  let busy = false, picked = null, pickedColor = COLORS[0], orderNo = 1 + rand(400);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  async function turn() {
    if (busy) return;
    if ($('#chuteCap').classList.contains('ready')) { openCapsule(); return; }
    const l = cur(), choices = pool(l);
    if (!choices.length) { renderMeta(); buzz(40); return; }
    busy = true;
    picked = choices[rand(choices.length)];
    pickedColor = COLORS[rand(COLORS.length)];

    clicks(); buzz([12, 60, 12, 60, 12]);
    if (M) {
      setTimeout(() => { thunk(); buzz(30); }, reduce ? 0 : 1500);
      await M.turn(pickedColor, true);
      if (l.noRepeat) { l.out.push(picked); save(); }
      $('#chuteCap').classList.add('ready');
      renderWords(); renderMeta();
      busy = false;
      return;
    }
    $('#dome').classList.add('shake');
    await $('#knob').animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }],
      { duration: reduce ? 1 : 900, easing: 'cubic-bezier(.45,.05,.4,1)' }).finished;
    $('#dome').classList.remove('shake');

    if (l.noRepeat) { l.out.push(picked); save(); renderDome(); }
    const fall = document.createElement('div');
    fall.className = 'falling'; fall.style.setProperty('--c', pickedColor);
    Object.assign(fall.style, { width: '12%', aspectRatio: '1', left: '44%', top: '52%' });
    $('#machine').appendChild(fall);
    const H = $('#machine').clientHeight, dy = (0.844 - 0.52) * H;   // from the glass floor to the chute
    await fall.animate([
      { transform: 'translateY(0) rotate(0)', opacity: 1 },
      { transform: `translateY(${dy * 0.12}px) rotate(90deg)`, opacity: 0, offset: .25 },
      { transform: `translateY(${dy * 1.08}px) rotate(200deg)`, opacity: 0, offset: .7 },
      { transform: `translateY(${dy}px) rotate(360deg)`, opacity: 1 },
    ], { duration: reduce ? 1 : 650, easing: 'ease-in' }).finished;
    fall.remove();
    thunk(); buzz(30);
    const cap = $('#chuteCap');
    cap.style.setProperty('--c', pickedColor);
    cap.classList.add('ready');
    renderWords(); renderMeta();
    busy = false;
  }

  function openCapsule() {
    if (!picked) return;
    const w = t(), l = cur();
    $('#chuteCap').classList.remove('ready');
    if (M) { M.clearTray(); if (!l.noRepeat) setTimeout(() => M.addCapsule(someColor()), 700); }
    l.history.unshift(picked); l.history = l.history.slice(0, 20); save();
    const r = $('#reveal');
    r.querySelector('.half.top').style.background = pickedColor;
    $('#slipNo').textContent = `No. ${String(orderNo++).padStart(4, '0')}`;
    $('#slipLabel').textContent = l.name || w.pick;
    $('#answer').textContent = picked;
    r.classList.remove('open'); r.classList.add('show');
    void r.offsetWidth; r.classList.add('open');
    chime(); buzz([20, 40, 60]);
    setTimeout(() => $('#againBtn').focus(), 300);
    renderWords(); renderMeta();
  }
  function closeReveal() { $('#reveal').classList.remove('show', 'open'); $('#knobBtn').focus(); }

  /* ---------- sharing ---------- */
  const b64 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64 = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0)));
  const shareLink = (l) => `${location.origin}${location.pathname}#m=${b64(JSON.stringify({ n: l.name, i: itemsOf(l) }))}`;
  async function share(text, url) {
    try { if (navigator.share) { await navigator.share({ text, url }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url ? `${text} ${url}` : text); toast(t().copied); }
    catch (e) { prompt('', url || text); }
  }
  let toastTimer;
  function toast(s) { const el = $('#toast'); el.textContent = s; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }

  let incoming = null;
  function readHash() {
    const m = location.hash.match(/^#m=([\w-]+)$/);
    if (!m) return;
    try {
      const d = JSON.parse(unb64(m[1]));
      if (!d || !Array.isArray(d.i)) throw 0;
      incoming = { name: String(d.n || t().newName).slice(0, 40), items: d.i.map(String).map((s) => s.slice(0, 80)).slice(0, 60) };
      showBanner();
    } catch (e) { toast(t().badLink); }
    history.replaceState(null, '', location.pathname);
  }
  function showBanner() {
    if (!incoming) return;
    $('#bannerText').textContent = t().banner(incoming.name, incoming.items.length);
    $('#banner').classList.add('show');
  }

  /* ---------- events ---------- */
  $('#knobBtn').onclick = turn;
  $('#turnBtn').onclick = turn;
  $('#chuteCap').onclick = openCapsule;
  $('#againBtn').onclick = () => { closeReveal(); setTimeout(turn, 120); };
  $('#closeBtn').onclick = closeReveal;
  $('#reveal').addEventListener('click', (e) => { if (e.target.id === 'reveal') closeReveal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#reveal').classList.contains('show')) closeReveal(); });
  $('#sendBtn').onclick = () => share(t().sendText(cur().name || t().pick, picked), shareLink(cur()));
  $('#shareBtn').onclick = () => share(t().shareText(cur().name || t().app), shareLink(cur()));

  document.querySelector('.lang').addEventListener('click', (e) => {
    const b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === data.lang) return;
    data.lang = b.dataset.lang;
    relocalise();   // menu machines you haven't edited follow the language
    save(); renderAll(); showBanner();
  });

  $('#menu').addEventListener('click', (e) => {
    const b = e.target.closest('[data-lib]'); if (!b || busy) return;
    let l = data.lists.find((x) => x.libId === b.dataset.lib);
    if (!l) { l = fromMenu(b.dataset.lib, data.lang, COLORS[data.lists.length % COLORS.length]); data.lists.push(l); toast(t().added(l.name)); }
    data.current = l.id; save();
    $('#chuteCap').classList.remove('ready');
    renderAll();
    $('#machine').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
  });
  $('#lists').addEventListener('click', (e) => {
    if (e.target.closest('#addList')) {
      const l = blank(t().newName, [], COLORS[data.lists.length % COLORS.length]);
      data.lists.push(l); data.current = l.id; save(); renderAll();
      $('#name').select(); return;
    }
    const b = e.target.closest('[data-id]'); if (!b || busy) return;
    data.current = b.dataset.id; save();
    $('#chuteCap').classList.remove('ready');
    renderAll();
  });
  $('#name').oninput = (e) => { cur().name = e.target.value; cur().edited = true; save(); renderLists(); renderMeta(); };
  let domeTimer;
  $('#items').oninput = (e) => {
    const l = cur();
    l.items = e.target.value.split('\n'); l.edited = true;
    const still = new Set(itemsOf(l)); l.out = l.out.filter((x) => still.has(x));
    save(); renderMeta(); clearTimeout(domeTimer); domeTimer = setTimeout(renderDome, 250);
  };
  $('#items').onblur = () => { const l = cur(); l.items = itemsOf(l); save(); };
  $('#noRepeat').onchange = (e) => { const l = cur(); l.noRepeat = e.target.checked; l.out = []; save(); renderMeta(); renderDome(); };
  $('#refill').onclick = () => { cur().out = []; save(); renderMeta(); renderDome(); thunk(); };
  $('#deleteList').onclick = () => {
    const l = cur();
    if (!confirm(t().confirmDelete(l.name || t().untitled))) return;
    data.lists = data.lists.filter((x) => x.id !== l.id);
    if (!data.lists.length) data.lists.push(blank(t().newName, [], COLORS[0]));
    data.current = data.lists[0].id; save(); renderAll();
  };
  $('#soundBtn').onclick = () => { data.sound = !data.sound; save(); renderWords(); };
  $('#bannerAdd').onclick = () => {
    const l = blank(incoming.name, incoming.items, COLORS[data.lists.length % COLORS.length]);
    data.lists.push(l); data.current = l.id; save(); renderAll();
    $('#banner').classList.remove('show'); toast(t().added(l.name)); incoming = null;
  };
  $('#bannerNo').onclick = () => { $('#banner').classList.remove('show'); incoming = null; };

  function use3D() {
    if (M || !window.Machine3D) return;
    M = window.Machine3D;
    $('#machine').classList.add('is3d');
    M.onHandle(turn);
    M.onCapsule(() => { if ($('#chuteCap').classList.contains('ready')) openCapsule(); });
    domeKey = ''; renderDome();
  }
  window.addEventListener('machine3d-ready', use3D);

  relocalise(); save();   // menu machines you haven't edited pick up the latest menu
  renderAll();
  use3D();
  readHash();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
